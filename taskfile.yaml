---
version: '3'
interval: '1500ms'

vars:
  TAG: instance-kwok
  REPOSITORY: registry.com/namespace/
  KARPENTER_CORE_DIR:
    sh: go list -m -f '{{"{{"}} .Dir {{"}}"}}' sigs.k8s.io/karpenter
  BINARY_FILENAME: karpenter-provider-vsphere
  KO_DOCKER_REPO: ghcr.io/absaoss/karpenter-provider-vsphere
  KOCACHE: ~/.ko
  VERSION:
    sh: git describe --tags --always | cut -d"v" -f2

tasks:
  mocks:
    cmds:
      - go install go.uber.org/mock/mockgen@v0.6.0
      - $(go env GOPATH)/bin/mockgen -package=mocks -destination=pkg/mocks/interface_mock.go k8s.io/client-go/kubernetes Interface
      - $(go env GOPATH)/bin/mockgen -package=mocks -destination=pkg/mocks/discovery_mock.go k8s.io/client-go/discovery DiscoveryInterface
  test:
    cmds:
      - go test -v ./... -coverprofile cover.out
  build:
    cmds:
      - go build ./...
  publish:
    cmds:
      - export KO_DOCKER_REPO=$REPOSITORY && ko build --tags $TAG --bare ./cmd/controller
  
  generate:
    desc: Generate code (mocks, deepcopy, etc.) and copy CRDs
    cmds:
      - go generate ./...
      - mkdir -p charts/karpenter-crd/templates charts/karpenter/crds
      - cp -f {{.KARPENTER_CORE_DIR}}/pkg/apis/crds/* charts/karpenter/crds/
      - cp -f pkg/apis/crds/karpenter.vsphere.com_vspherenodeclasses.yaml charts/karpenter/crds/
      # karpenter-crd chart templates are Helm-rendered, so re-inject the additionalAnnotations hook controller-gen doesn't know about
      - |
        cp -f {{.KARPENTER_CORE_DIR}}/pkg/apis/crds/* charts/karpenter-crd/templates/
        cp -f pkg/apis/crds/karpenter.vsphere.com_vspherenodeclasses.yaml charts/karpenter-crd/templates/
        perl -pi -e 's/(controller-gen\.kubebuilder\.io\/version: v[0-9.]+)/$1\n    {{"{{"}}- with .Values.additionalAnnotations {{"}}"}}\n      {{"{{"}}- toYaml . | nindent 4 {{"}}"}}\n    {{"{{"}}- end {{"}}"}}/' charts/karpenter-crd/templates/*.yaml
  
  image:
    desc: Build the Karpenter controller images using ko build
    cmds:
      - |
        CONTROLLER_IMG=$(ko build --bare github.com/absaoss/karpenter-provider-vsphere/cmd/controller)
        IMG_REPOSITORY=$(echo $CONTROLLER_IMG | cut -d "@" -f 1 | cut -d ":" -f 1)
        IMG_TAG=$(echo $CONTROLLER_IMG | cut -d "@" -f 1 | cut -d ":" -f 2 -s)
        IMG_DIGEST=$(echo $CONTROLLER_IMG | cut -d "@" -f 2)
        echo "Image built: $IMG_REPOSITORY:$IMG_TAG@$IMG_DIGEST"
    env:
      KOCACHE: "{{.KOCACHE}}"
      KO_DOCKER_REPO: "{{.KO_DOCKER_REPO}}"
      GOFLAGS: "-ldflags=-X=sigs.k8s.io/karpenter/pkg/operator.Version={{.VERSION}}"
  
  binary:
    desc: Build the Karpenter controller binary using go build
    cmds:
      - go build -ldflags="-X=sigs.k8s.io/karpenter/pkg/operator.Version={{.VERSION}}" -o {{.BINARY_FILENAME}} ./cmd/controller/...
      - 'echo "Binary built: {{.BINARY_FILENAME}}"'
  
  "debug:vscode:gen":
    desc: Generate .vscode/launch.json for Go debugging
    cmds:
      - mkdir -p .vscode
      - |
        cat > .vscode/launch.json << 'EOF'
        {
            "version": "0.2.0",
            "configurations": [
                {
                    "name": "Launch controller",
                    "type": "go",
                    "request": "launch",
                    "mode": "auto",
                    "program": "${workspaceFolder}/cmd/controller",
                    "cwd": "${workspaceFolder}",
                    "env": {
                        "CLUSTER_NAME": "",
                        "CLUSTER_ENDPOINT": "",
                        "JOIN_TOKEN": "",
                        "KUBE_DISTRO": "",
                        "GOVC_URL": "",
                        "GOVC_USERNAME": "",
                        "GOVC_PASSWORD": "",
                        "VSPHERE_FOLDER": "",
                        "VSPHERE_DC": "",
                        "GOVC_INSECURE": "",
                        "KUBECONFIG": "{{env "HOME"}}/.kube/testcluster.yaml",
                        "LOG_OUTPUT_PATHS": "stdout",
                        "LOG_ERROR_OUTPUT_PATHS": "stderr",
                        "HEALTH_PROBE_PORT": "8081",
                        "METRICS_PORT": "8080",
                        "PREFERENCE_POLICY": "Respect"
                    },
                    "args": [
                        "-leader-election-namespace=karpenter"
                    ]
                }
            ]
        }
        EOF
      - echo "Generated .vscode/launch.json"
