---
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  issues: write

env:
  GO111MODULE: "on"

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  provider:
    if: needs.release.outputs.release_created
    runs-on: ubuntu-latest
    name: Publish Provider
    needs:
      - release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: setup ko
        uses: ko-build/setup-ko@v0.8
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          
      - run: ko build -t $TAG --bare github.com/absaoss/karpenter-provider-vsphere/cmd/controller
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
      # package and push helm
      - name: package/push helm
        env:
          CHART_VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          pushd charts
          helm package karpenter-crd
          helm package karpenter
          helm push karpenter-crd-$CHART_VERSION.tgz oci://ghcr.io/absaoss/karpenter
          helm push karpenter-$CHART_VERSION.tgz oci://ghcr.io/absaoss/karpenter
          popd
